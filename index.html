<body>
  <div id="root"><!--app-html--></div>
  <script>
    /* Reveal what is already on screen without waiting for the app's code. */
    (function () {
      var d = document
      if (!('IntersectionObserver' in window)) { d.documentElement.classList.remove('js'); return }
      var io = new IntersectionObserver(function (es) {
        es.forEach(function (e) { if (e.isIntersecting) { e.target.setAttribute('data-in', ''); io.unobserve(e.target) } })
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 })
      d.querySelectorAll('[data-stagger]').forEach(function (g) {
        var step = +g.getAttribute('data-stagger') || 80, i = 0
        ;[].forEach.call(g.children, function (el) { if (el.hasAttribute('data-reveal')) el.style.setProperty('--d', i++ * step + 'ms') })
      })
      d.querySelectorAll('[data-reveal]').forEach(function (el) { io.observe(el) })
    })()
  </script>
  <script type="module" src="/src/entry-client.jsx"></script>
</body>
