<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg10)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle">PRO KEYBOARD SHORTCUTS &amp; MUSCLE MEMORY</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 10 Master Universal Hotkeys: Ctrl + C, V, Z, A, S &amp; Win Key Combinations</text>

  <!-- KEYBOARD GRAPHIC -->
  <g transform="translate(60, 90)">
    <rect width="680" height="320" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    
    <!-- KEYBOARD OVERLAY -->
    <rect x="30" y="20" width="620" height="150" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

    <!-- Key Row 1 (Tab, Q, W, E, R, T, Y...) -->
    <rect x="40" y="30" width="40" height="30" rx="4" fill="#334155"/><text x="60" y="50" font-family="monospace" font-size="11" fill="#CBD5E1" text-anchor="middle">Tab</text>
    <rect x="85" y="30" width="30" height="30" rx="4" fill="#334155"/><text x="100" y="50" font-family="monospace" font-size="11" fill="#CBD5E1" text-anchor="middle">Q</text>
    <rect x="120" y="30" width="30" height="30" rx="4" fill="#334155"/><text x="135" y="50" font-family="monospace" font-size="11" fill="#CBD5E1" text-anchor="middle">W</text>
    <rect x="155" y="30" width="30" height="30" rx="4" fill="#10B981"/><text x="170" y="50" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">E</text>

    <!-- Key Row 2 (Ctrl, Win, Alt, Z, X, C, V, S...) -->
    <rect x="40" y="65" width="45" height="30" rx="4" fill="#10B981"/><text x="62" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">Ctrl</text>
    <rect x="90" y="65" width="35" height="30" rx="4" fill="#3B82F6"/><text x="107" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Win</text>
    <rect x="130" y="65" width="35" height="30" rx="4" fill="#F59E0B"/><text x="147" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">Alt</text>
    <rect x="170" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="185" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">Z</text>
    <rect x="205" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="220" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">X</text>
    <rect x="240" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="255" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">C</text>
    <rect x="275" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="290" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">V</text>
    <rect x="310" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="325" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">S</text>
    <rect x="345" y="65" width="30" height="30" rx="4" fill="#10B981"/><text x="360" y="85" font-family="monospace" font-size="11" font-weight="800" fill="#0F172A" text-anchor="middle">A</text>

    <!-- Spacebar -->
    <rect x="180" y="102" width="220" height="30" rx="4" fill="#334155"/><text x="290" y="122" font-family="monospace" font-size="11" fill="#CBD5E1" text-anchor="middle">Spacebar</text>

    <!-- CHEATSHEET GRID -->
    <g transform="translate(30, 185)">
      <rect width="620" height="115" rx="8" fill="#0F172A"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399">Ctrl + C: Copy</text>
      <text x="160" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399">Ctrl + V: Paste</text>
      <text x="300" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399">Ctrl + Z: Undo</text>
      <text x="440" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399">Ctrl + S: Save File</text>

      <text x="20" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#60A5FA">Win + D: Desktop</text>
      <text x="160" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#60A5FA">Win + E: Explorer</text>
      <text x="300" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#60A5FA">Win + L: Lock PC</text>
      <text x="440" y="65" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FBBF24">Alt + Tab: Switch</text>

      <text x="20" y="98" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">🚀 Master these 8 shortcuts to double your computer operating speed!</text>
    </g>
  </g>
</svg>
