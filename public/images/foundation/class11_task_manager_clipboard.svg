<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg11" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg11)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">TASK MANAGER &amp; CLIPBOARD HISTORY (Win + V)</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 11 End Frozen Apps with Task Manager &amp; Paste Past Items with Win + V</text>

  <g transform="translate(60, 90)">
    <!-- LEFT: Clipboard History (Win + V) -->
    <g transform="translate(0, 0)">
      <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
      <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#60A5FA" text-anchor="middle">📋 Clipboard History (Win + V)</text>

      <rect x="20" y="55" width="280" height="55" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
      <text x="35" y="77" font-family="system-ui, sans-serif" font-size="11" fill="#34D399">1. Copied Text 3: Sirajul Huda Portal</text>
      <text x="35" y="95" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">10:24 AM - Click to paste anywhere</text>

      <rect x="20" y="125" width="280" height="55" rx="6" fill="#0F172A"/>
      <text x="35" y="147" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">2. Copied Text 2: System RAM Specs</text>
      <text x="35" y="165" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">10:20 AM</text>

      <rect x="20" y="195" width="280" height="55" rx="6" fill="#0F172A"/>
      <text x="35" y="217" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">3. Copied Image / Screenshot</text>
      <text x="35" y="235" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">10:15 AM</text>

      <rect x="20" y="262" width="280" height="26" rx="6" fill="#3B82F6"/>
      <text x="160" y="279" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">Press Win + V to Open History</text>
    </g>

    <!-- RIGHT: Task Manager (Ctrl + Shift + Esc) -->
    <g transform="translate(360, 0)">
      <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
      <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FCA5A5" text-anchor="middle">⚙ Task Manager (Ctrl+Shift+Esc)</text>

      <rect x="20" y="55" width="280" height="40" rx="6" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="35" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#EF4444">⚠ Frozen App (Not Responding)</text>
      <text x="240" y="78" font-family="system-ui, sans-serif" font-size="11" fill="#EF4444">98% CPU</text>

      <rect x="20" y="105" width="280" height="35" rx="6" fill="#0F172A"/>
      <text x="35" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">Google Chrome (Normal)</text>
      <text x="250" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">12% CPU</text>

      <rect x="20" y="150" width="280" height="35" rx="6" fill="#0F172A"/>
      <text x="35" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">File Explorer</text>
      <text x="255" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">2% CPU</text>

      <!-- End Task Action Button -->
      <rect x="180" y="200" width="120" height="34" rx="6" fill="#EF4444"/>
      <text x="240" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">End Task 🛑</text>

      <rect x="20" y="262" width="280" height="26" rx="6" fill="#0F172A"/>
      <text x="160" y="279" font-family="system-ui, sans-serif" font-size="10" fill="#FCA5A5" text-anchor="middle">Closes frozen apps without rebooting PC</text>
    </g>
  </g>
</svg>
