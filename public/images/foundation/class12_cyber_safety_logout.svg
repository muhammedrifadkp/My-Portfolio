<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg12" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg12)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#EF4444" text-anchor="middle">CYBER SAFETY &amp; LAB PC SESSION LOGOUT RULES</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 12 Safe URLs vs Phishing Links &amp; Shared Computer Logout Rules</text>

  <g transform="translate(60, 90)">
    <!-- LEFT: Phishing vs Safe URL -->
    <g transform="translate(0, 0)">
      <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
      <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#34D399" text-anchor="middle">🔒 Safe URL vs ⚠ Phishing Link</text>

      <!-- SAFE URL -->
      <rect x="20" y="55" width="280" height="60" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="35" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#34D399">✓ SAFE URL:</text>
      <text x="35" y="98" font-family="monospace" font-size="10" fill="#CBD5E1">🔒 https://sirajulhuda.org</text>

      <!-- PHISHING URL -->
      <rect x="20" y="130" width="280" height="60" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="35" y="153" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#EF4444">❌ PHISHING SCAM LINK:</text>
      <text x="35" y="173" font-family="monospace" font-size="10" fill="#FCA5A5">http://siraj-huda-free-gift.xyz</text>

      <rect x="20" y="210" width="280" height="70" rx="8" fill="#0F172A"/>
      <text x="35" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Check padlock 🔒 icon</text>
      <text x="35" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Never click fake "Download" ads</text>
      <text x="35" y="268" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Never share account passwords</text>
    </g>

    <!-- RIGHT: Shared PC Logout Hygiene -->
    <g transform="translate(360, 0)">
      <rect width="320" height="300" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <text x="160" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FBBF24" text-anchor="middle">🔑 Shared Lab PC Logout Rule</text>

      <rect x="20" y="55" width="280" height="110" rx="8" fill="#0F172A"/>
      <text x="160" y="80" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#FBBF24" text-anchor="middle">Before leaving lab PC:</text>
      <text x="35" y="105" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">1. Sign Out of Google / Email</text>
      <text x="35" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">2. Click "Exit Session" on Portal</text>
      <text x="35" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">3. Clear downloads &amp; recycle bin</text>

      <rect x="60" y="185" width="200" height="40" rx="8" fill="#DC2626"/>
      <text x="160" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">🚪 Sign Out &amp; Exit Session</text>

      <rect x="20" y="245" width="280" height="40" rx="6" fill="#0F172A"/>
      <text x="160" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#34D399" text-anchor="middle">✓ Protects your privacy for next student</text>
    </g>
  </g>
</svg>
