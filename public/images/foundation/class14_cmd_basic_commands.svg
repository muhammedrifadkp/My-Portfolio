<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-basic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1e38" />
    </linearGradient>
    <linearGradient id="card-basic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <filter id="shadow-clean" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1150" height="720" fill="url(#bg-basic)" rx="16" />

  <!-- Header Banner -->
  <rect x="40" y="30" width="1070" height="75" rx="12" fill="url(#card-basic)" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow-clean)" />
  <text x="70" y="62" font-family="'Segoe UI', system-ui, sans-serif" font-size="23" font-weight="bold" fill="#60a5fa">
    💻 Windows CMD Essentials: File &amp; Directory Commands
  </text>
  <text x="70" y="88" font-family="'Segoe UI', sans-serif" font-size="14" fill="#9ca3af">
    Basic to Intermediate Command Line Cheatsheet for IT Students • (Folder Creation, Navigation &amp; File Ops)
  </text>
  <rect x="940" y="48" width="140" height="36" rx="18" fill="#2563eb" />
  <text x="1010" y="71" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">📁 CLI Basics</text>

  <!-- Command Grid Box 1: Directory & Navigation -->
  <g transform="translate(40, 130)">
    <!-- Box Title -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#1e3a8a" />
    <text x="18" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#93c5fd">📂 1. Directory &amp; Folder Operations</text>

    <!-- Table Header -->
    <rect x="0" y="48" width="520" height="32" fill="#0f172a" />
    <text x="18" y="70" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">Command Syntax</text>
    <text x="270" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Malayalam / Simple Meaning</text>

    <!-- Row 1 -->
    <rect x="0" y="85" width="520" height="40" fill="#1e293b" opacity="0.7" />
    <text x="18" y="110" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">mkdir MyFolder</text>
    <text x="270" y="110" font-family="sans-serif" font-size="13" fill="#e2e8f0">📁 പുതിയ folder ഉണ്ടാക്കുന്നു</text>

    <!-- Row 2 -->
    <rect x="0" y="130" width="520" height="40" fill="#0f172a" opacity="0.7" />
    <text x="18" y="155" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">cd MyFolder</text>
    <text x="270" y="155" font-family="sans-serif" font-size="13" fill="#e2e8f0">📂 ആ folder-ലേക്ക് പോകുന്നു</text>

    <!-- Row 3 -->
    <rect x="0" y="175" width="520" height="40" fill="#1e293b" opacity="0.7" />
    <text x="18" y="200" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">cd ..</text>
    <text x="270" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0">⬅️ ഒരു folder പിന്നിലേക്ക് പോകുന്നു</text>

    <!-- Row 4 -->
    <rect x="0" y="220" width="520" height="40" fill="#0f172a" opacity="0.7" />
    <text x="18" y="245" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">dir</text>
    <text x="270" y="245" font-family="sans-serif" font-size="13" fill="#e2e8f0">📋 files &amp; folders കാണിക്കുന്നു</text>

    <!-- Row 5 -->
    <rect x="0" y="265" width="520" height="40" fill="#1e293b" opacity="0.7" />
    <text x="18" y="290" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">tree /F</text>
    <text x="270" y="290" font-family="sans-serif" font-size="13" fill="#e2e8f0">🌳 folder tree ഘടന കാണിക്കുന്നു</text>

    <!-- Row 6 -->
    <rect x="0" y="310" width="520" height="40" fill="#0f172a" opacity="0.7" />
    <text x="18" y="335" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">cls</text>
    <text x="270" y="335" font-family="sans-serif" font-size="13" fill="#e2e8f0">🧹 CMD screen clear ചെയ്യുന്നു</text>

    <!-- Row 7 -->
    <rect x="0" y="355" width="520" height="40" fill="#1e293b" opacity="0.7" />
    <text x="18" y="380" font-family="'Consolas', monospace" font-size="13.5" font-weight="bold" fill="#4ade80">cd \</text>
    <text x="270" y="380" font-family="sans-serif" font-size="13" fill="#e2e8f0">🏠 Root Drive (C:\)-ലേക്ക് മടങ്ങുന്നു</text>
  </g>

  <!-- Command Grid Box 2: File Management & Edit -->
  <g transform="translate(590, 130)">
    <!-- Box Title -->
    <rect x="0" y="0" width="520" height="42" rx="8" fill="#065f46" />
    <text x="18" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" fill="#a7f3d0">📄 2. File Management &amp; Content</text>

    <!-- Table Header -->
    <rect x="0" y="48" width="520" height="32" fill="#022c22" />
    <text x="18" y="70" font-family="monospace" font-size="13" font-weight="bold" fill="#34d399">Command Syntax</text>
    <text x="270" y="70" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">Malayalam / Simple Meaning</text>

    <!-- Row 1 -->
    <rect x="0" y="85" width="520" height="40" fill="#064e3b" opacity="0.5" />
    <text x="18" y="110" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">copy a.txt b.txt</text>
    <text x="270" y="110" font-family="sans-serif" font-size="13" fill="#e2e8f0">📄 ഒരു file copy ചെയ്യുന്നു</text>

    <!-- Row 2 -->
    <rect x="0" y="130" width="520" height="40" fill="#022c22" opacity="0.7" />
    <text x="18" y="155" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">del file.txt</text>
    <text x="270" y="155" font-family="sans-serif" font-size="13" fill="#e2e8f0">🗑️ ഒരു file delete ചെയ്യുന്നു</text>

    <!-- Row 3 -->
    <rect x="0" y="175" width="520" height="40" fill="#064e3b" opacity="0.5" />
    <text x="18" y="200" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">ren old.txt new.txt</text>
    <text x="270" y="200" font-family="sans-serif" font-size="13" fill="#e2e8f0">✏️ file-ന്റെ പേര് മാറ്റുന്നു</text>

    <!-- Row 4 -->
    <rect x="0" y="220" width="520" height="40" fill="#022c22" opacity="0.7" />
    <text x="18" y="245" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">type file.txt</text>
    <text x="270" y="245" font-family="sans-serif" font-size="13" fill="#e2e8f0">📖 file-ലെ ടെക്സ്റ്റ് സ്ക്രീനിൽ കാണുന്നു</text>

    <!-- Row 5 -->
    <rect x="0" y="265" width="520" height="40" fill="#064e3b" opacity="0.5" />
    <text x="18" y="290" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">echo Hi &gt; note.txt</text>
    <text x="270" y="290" font-family="sans-serif" font-size="13" fill="#e2e8f0">✍️ ടെക്സ്റ്റ് ഇട്ട് പുതിയ ഫയൽ ഉണ്ടാക്കുന്നു</text>

    <!-- Row 6 -->
    <rect x="0" y="310" width="520" height="40" fill="#022c22" opacity="0.7" />
    <text x="18" y="335" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">move a.txt SubFolder</text>
    <text x="270" y="335" font-family="sans-serif" font-size="13" fill="#e2e8f0">📦 ഫയൽ മറ്റൊരു ഫോൾഡറിലേക്ക് മാറ്റുന്നു</text>

    <!-- Row 7 -->
    <rect x="0" y="355" width="520" height="40" fill="#064e3b" opacity="0.5" />
    <text x="18" y="380" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#facc15">rmdir /s /q Folder</text>
    <text x="270" y="380" font-family="sans-serif" font-size="13" fill="#e2e8f0">💥 ഫോൾഡറും അതിലെ സകലതും മായ്ക്കുന്നു</text>
  </g>

  <!-- Bottom Practice Lab Prompt Card -->
  <g transform="translate(40, 565)">
    <rect x="0" y="0" width="1070" height="115" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow-clean)" />
    <text x="25" y="32" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#c084fc">🧪 Student Hands-on Practice Exercise:</text>
    <text x="25" y="62" font-family="'Consolas', monospace" font-size="13.5" fill="#38bdf8">
      1. Press Win+R -&gt; type "cmd" -&gt; press Enter
    </text>
    <text x="25" y="90" font-family="'Consolas', monospace" font-size="13.5" fill="#4ade80">
      2. Type: mkdir StudentLab &amp;&amp; cd StudentLab &amp;&amp; echo Hello Sirajul Huda &gt; test.txt &amp;&amp; type test.txt &amp;&amp; tree /F
    </text>
  </g>
</svg>
