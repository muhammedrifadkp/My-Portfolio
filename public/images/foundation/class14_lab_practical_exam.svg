<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg14)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#10B981" text-anchor="middle">COMPREHENSIVE DIGITAL SKILLS PRACTICAL LAB EXAM</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 14 End-to-End Practical Assessment: Hardware, OS, Files, Hotkeys, PDF &amp; Cloud</text>

  <!-- 4-STEP LAB EXAM WORKFLOW -->
  <g transform="translate(40, 90)">
    <rect width="720" height="320" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>

    <!-- STEP 1 -->
    <g transform="translate(30, 30)">
      <rect width="310" height="110" rx="8" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#60A5FA">Task 1: System Specs &amp; Folders</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Create folder hierarchy in Documents</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Check RAM, CPU &amp; C: Drive Specs</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">⏱ Time: 10 mins</text>
    </g>

    <!-- STEP 2 -->
    <g transform="translate(380, 30)">
      <rect width="310" height="110" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">Task 2: Hotkeys &amp; Screenshots</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Type summary in Notepad using hotkeys</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Capture Win+Shift+S annotated screenshot</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">⏱ Time: 15 mins</text>
    </g>

    <!-- STEP 3 -->
    <g transform="translate(30, 160)">
      <rect width="310" height="110" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#C084FC">Task 3: PDF Export &amp; ZIP Compression</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Print document to PDF format</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Compress project folder into .ZIP archive</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">⏱ Time: 10 mins</text>
    </g>

    <!-- STEP 4 -->
    <g transform="translate(380, 160)">
      <rect width="310" height="110" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <text x="20" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#34D399">Task 4: Cloud Upload &amp; Session Exit</text>
      <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Upload .ZIP archive to Google Drive</text>
      <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">● Perform clean browser session logout</text>
      <text x="20" y="95" font-family="system-ui, sans-serif" font-size="10" fill="#34D399">🎓 Foundation Readiness Certified!</text>
    </g>
  </g>
</svg>
