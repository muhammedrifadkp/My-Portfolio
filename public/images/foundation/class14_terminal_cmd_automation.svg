<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="term-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad)" rx="16" />

  <!-- Terminal Window Header -->
  <rect x="50" y="40" width="700" height="370" fill="url(#term-grad)" rx="12" filter="url(#shadow)" stroke="#334155" stroke-width="1.5" />
  <path d="M 50 40 L 750 40 A 12 12 0 0 1 750 80 L 50 80 Z" fill="#1e293b" />
  
  <!-- Window Controls -->
  <circle cx="75" cy="60" r="6" fill="#ef4444" />
  <circle cx="95" cy="60" r="6" fill="#f59e0b" />
  <circle cx="115" cy="60" r="6" fill="#10b981" />
  
  <!-- Window Title -->
  <text x="400" y="65" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="middle">
    💻 Command Prompt (Administrator) - Windows Terminal
  </text>

  <!-- CLI Code Content -->
  <!-- Prompt line 1 -->
  <text x="80" y="120" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#38bdf8" font-weight="bold">C:\Users\Student&gt;</text>
  <text x="250" y="120" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#f8fafc">mkdir Digital_Skills_2026</text>

  <!-- Response 1 -->
  <text x="80" y="150" font-family="'Consolas', 'Courier New', monospace" font-size="15" fill="#4ade80">✓ Directory C:\Users\Student\Digital_Skills_2026 Created Successfully.</text>

  <!-- Prompt line 2 -->
  <text x="80" y="190" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#38bdf8" font-weight="bold">C:\Users\Student&gt;</text>
  <text x="250" y="190" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#f8fafc">cd Digital_Skills_2026 &amp;&amp; tree /F</text>

  <!-- Tree Output -->
  <text x="80" y="225" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#a7f3d0">C:\USERS\STUDENT\DIGITAL_SKILLS_2026</text>
  <text x="80" y="248" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#64748b">├── </text>
  <text x="120" y="248" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#fbbf24">📁 Module_1_Hardware</text>
  <text x="80" y="270" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#64748b">├── </text>
  <text x="120" y="270" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#fbbf24">📁 Module_2_File_Manager</text>
  <text x="80" y="292" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#64748b">└── </text>
  <text x="120" y="292" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#fbbf24">📁 Module_6_Automation_CLI</text>
  <text x="145" y="314" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#64748b">└── </text>
  <text x="185" y="314" font-family="'Consolas', 'Courier New', monospace" font-size="14" fill="#e2e8f0">📄 auto_rename_script.bat</text>

  <!-- Prompt line 3 -->
  <text x="80" y="355" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#38bdf8" font-weight="bold">C:\Users\Student\Digital_Skills_2026&gt;</text>
  <text x="440" y="355" font-family="'Consolas', 'Courier New', monospace" font-size="16" fill="#f8fafc">ping google.com</text>

  <!-- Cursor -->
  <rect x="590" y="340" width="10" height="20" fill="#38bdf8">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- Badge Overlay -->
  <rect x="520" y="365" width="210" height="32" rx="8" fill="#10b981" />
  <text x="625" y="386" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Hacker CLI Automation</text>
</svg>
