<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ssdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">INSIDE THE SYSTEM UNIT: CPU vs RAM vs SSD</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 02 Architecture &amp; Performance Breakdown</text>

  <!-- ITEM 1: CPU -->
  <g transform="translate(40, 90)">
    <rect width="220" height="320" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#60A5FA" text-anchor="middle">1. CPU (Processor)</text>
    <text x="110" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">The Computer "Brain"</text>

    <!-- Chip graphic -->
    <rect x="60" y="75" width="100" height="100" rx="8" fill="url(#cpuGrad)" stroke="#93C5FD" stroke-width="2"/>
    <rect x="75" y="90" width="70" height="70" rx="4" fill="#0F172A"/>
    <text x="110" y="130" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#60A5FA" text-anchor="middle">Intel/AMD</text>
    
    <!-- Pins around chip -->
    <path d="M50 95 H60 M50 115 H60 M50 135 H60 M50 155 H60" stroke="#F59E0B" stroke-width="3"/>
    <path d="M160 95 H170 M160 115 H170 M160 135 H170 M160 155 H170" stroke="#F59E0B" stroke-width="3"/>

    <rect x="15" y="200" width="190" height="100" rx="8" fill="#0F172A"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93C5FD">● Role: Processes all commands</text>
    <text x="25" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Speed: GHz (Clock Rate)</text>
    <text x="25" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Cores: Quad-core, i5/i7</text>
    <text x="25" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#34D399">🧠 Brain of System</text>
  </g>

  <!-- ITEM 2: RAM -->
  <g transform="translate(290, 90)">
    <rect width="220" height="320" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#34D399" text-anchor="middle">2. RAM (Memory)</text>
    <text x="110" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Temporary Work Desk</text>

    <!-- RAM Stick Graphic -->
    <rect x="35" y="80" width="150" height="90" rx="4" fill="url(#ramGrad)" stroke="#6EE7B7" stroke-width="2"/>
    <rect x="45" y="90" width="30" height="40" fill="#0F172A"/>
    <rect x="85" y="90" width="30" height="40" fill="#0F172A"/>
    <rect x="125" y="90" width="30" height="40" fill="#0F172A"/>
    <!-- Gold pins at bottom -->
    <rect x="40" y="160" width="140" height="8" fill="#F59E0B"/>

    <rect x="15" y="200" width="190" height="100" rx="8" fill="#0F172A"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6EE7B7">● Role: Active open apps</text>
    <text x="25" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Size: 8GB / 16GB / 32GB</text>
    <text x="25" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Reset: Cleared on reboot</text>
    <text x="25" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#60A5FA">⚡ Temporary Desk Space</text>
  </g>

  <!-- ITEM 3: SSD Storage -->
  <g transform="translate(540, 90)">
    <rect width="220" height="320" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    <text x="110" y="30" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#C084FC" text-anchor="middle">3. SSD / Storage</text>
    <text x="110" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Permanent Storage Cabinet</text>

    <!-- SSD Drive Graphic -->
    <rect x="45" y="80" width="130" height="90" rx="6" fill="url(#ssdGrad)" stroke="#C084FC" stroke-width="2"/>
    <text x="110" y="125" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">SSD 512GB</text>
    <rect x="145" y="145" width="25" height="15" fill="#334155"/>

    <rect x="15" y="200" width="190" height="100" rx="8" fill="#0F172A"/>
    <text x="25" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C084FC">● Role: Permanent files/OS</text>
    <text x="25" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Size: 256GB / 512GB / 1TB</text>
    <text x="25" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">● Safe: Kept when PC turns off</text>
    <text x="25" y="288" font-family="system-ui, sans-serif" font-size="11" fill="#F59E0B">📁 Filing Cabinet</text>
  </g>
</svg>
