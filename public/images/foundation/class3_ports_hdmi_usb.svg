<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg3)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#F59E0B" text-anchor="middle">CONNECTING PERIPHERALS: PORTS &amp; PLUGS GUIDE</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 03 Hardware Ports, HDMI, USB-A/C &amp; Audio Connections</text>

  <!-- GRID OF 4 PORTS -->
  <!-- PORT 1: USB Type-A -->
  <g transform="translate(50, 90)">
    <rect width="330" height="150" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#60A5FA">1. USB Type-A Port &amp; Flash Drive</text>
    <rect x="25" y="55" width="75" height="35" rx="3" fill="#0F172A" stroke="#60A5FA" stroke-width="2"/>
    <rect x="35" y="65" width="55" height="10" fill="#3B82F6"/> <!-- Blue USB 3.0 insulator -->
    <text x="120" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Blue = USB 3.0 High Speed</text>
    <text x="120" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Standard Flash Drive &amp; Mouse</text>
    <rect x="20" y="110" width="290" height="26" rx="6" fill="#0F172A"/>
    <text x="165" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#34D399" text-anchor="middle">✓ Always eject safely before unplugging</text>
  </g>

  <!-- PORT 2: HDMI Port -->
  <g transform="translate(420, 90)">
    <rect width="330" height="150" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FBBF24">2. HDMI Port (Projector &amp; TV)</text>
    <!-- Trapezoid HDMI shape -->
    <path d="M25 55 H95 L85 85 H35 Z" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <text x="120" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Audio &amp; Video Output</text>
    <text x="120" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Connects PC to Lab Projector</text>
    <rect x="20" y="110" width="290" height="26" rx="6" fill="#0F172A"/>
    <text x="165" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#FBBF24" text-anchor="middle">⌨ Press Win + P to switch display modes</text>
  </g>

  <!-- PORT 3: USB Type-C -->
  <g transform="translate(50, 260)">
    <rect width="330" height="150" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#34D399">3. USB Type-C (Reversible)</text>
    <rect x="25" y="60" width="70" height="24" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <text x="120" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Modern Laptop Standard</text>
    <text x="120" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Fast Charging &amp; Data Transfer</text>
    <rect x="20" y="110" width="290" height="26" rx="6" fill="#0F172A"/>
    <text x="165" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#6EE7B7" text-anchor="middle">🔄 Plugs in either side up</text>
  </g>

  <!-- PORT 4: Audio & Wireless -->
  <g transform="translate(420, 260)">
    <rect width="330" height="150" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#F472B6">4. 3.5mm Audio &amp; Bluetooth</text>
    <circle cx="50" cy="72" r="14" fill="#0F172A" stroke="#F472B6" stroke-width="2"/>
    <circle cx="50" cy="72" r="6" fill="#F472B6"/>
    <text x="120" y="75" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Headphone / Mic Jack</text>
    <text x="120" y="95" font-family="system-ui, sans-serif" font-size="12" fill="#CBD5E1">● Bluetooth Wireless Mouse/Audio</text>
    <rect x="20" y="110" width="290" height="26" rx="6" fill="#0F172A"/>
    <text x="165" y="127" font-family="system-ui, sans-serif" font-size="11" fill="#F472B6" text-anchor="middle">🎧 Audio Output &amp; Mic Recording</text>
  </g>
</svg>
