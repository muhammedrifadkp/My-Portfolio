<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg4)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#60A5FA" text-anchor="middle">DESKTOP NAVIGATION &amp; WINDOWS SNAP ASSIST</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 04 Side-by-Side Windows Multitasking (Win + Left/Right Arrow)</text>

  <!-- WINDOW OVERVIEW MOCKUP -->
  <g transform="translate(60, 90)">
    <!-- Monitor Outer Frame -->
    <rect width="680" height="320" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <rect x="10" y="10" width="660" height="260" rx="8" fill="#0F172A"/>

    <!-- LEFT WINDOW: Document Notes -->
    <rect x="20" y="20" width="315" height="240" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="20" y="20" width="315" height="28" rx="6" fill="#334155"/>
    <circle cx="35" cy="34" r="5" fill="#EF4444"/>
    <circle cx="50" cy="34" r="5" fill="#F59E0B"/>
    <circle cx="65" cy="34" r="5" fill="#10B981"/>
    <text x="85" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#93C5FD">Notepad - Study Notes.txt</text>

    <text x="35" y="70" font-family="monospace" font-size="12" fill="#E2E8F0">1. Personal Computer (PC) Basics</text>
    <text x="35" y="95" font-family="monospace" font-size="12" fill="#94A3B8">2. Hardware vs Software</text>
    <text x="35" y="120" font-family="monospace" font-size="12" fill="#94A3B8">3. System Memory (RAM): 16GB</text>
    <rect x="35" y="140" width="280" height="1" fill="#475569"/>
    <text x="35" y="170" font-family="monospace" font-size="12" fill="#34D399">✓ Win + Left Arrow to Snap Left</text>

    <!-- RIGHT WINDOW: Browser / Reference -->
    <rect x="345" y="20" width="315" height="240" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="345" y="20" width="315" height="28" rx="6" fill="#334155"/>
    <circle cx="360" cy="34" r="5" fill="#EF4444"/>
    <circle cx="375" cy="34" r="5" fill="#F59E0B"/>
    <circle cx="390" cy="34" r="5" fill="#10B981"/>
    <text x="410" y="38" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A7F3D0">Browser - Reference Web Page</text>

    <rect x="360" y="60" width="280" height="24" rx="4" fill="#0F172A"/>
    <text x="370" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#94A3B8">https://sirajulhuda.org/digital-skills</text>
    <rect x="360" y="95" width="180" height="15" rx="3" fill="#3B82F6"/>
    <rect x="360" y="120" width="250" height="10" rx="2" fill="#475569"/>
    <rect x="360" y="138" width="220" height="10" rx="2" fill="#475569"/>
    <text x="360" y="180" font-family="system-ui, sans-serif" font-size="12" fill="#6EE7B7">✓ Win + Right Arrow to Snap Right</text>

    <!-- Taskbar at Bottom -->
    <rect x="10" y="275" width="660" height="35" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="40" cy="292" r="10" fill="#3B82F6"/> <!-- Start button -->
    <rect x="65" y="284" width="80" height="16" rx="4" fill="#1E293B"/> <!-- Search -->
    <text x="75" y="296" font-family="system-ui, sans-serif" font-size="9" fill="#94A3B8">Search...</text>
    <rect x="160" y="284" width="24" height="16" rx="3" fill="#3B82F6"/> <!-- Notepad icon -->
    <rect x="190" y="284" width="24" height="16" rx="3" fill="#10B981"/> <!-- Browser icon -->
    <text x="600" y="296" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">10:30 AM</text>
  </g>
</svg>
