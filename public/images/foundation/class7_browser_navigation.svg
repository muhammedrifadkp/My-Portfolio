<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg7)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38BDF8" text-anchor="middle">WEB BROWSER NAVIGATION: TABS &amp; BOOKMARKS</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 07 Address Bar, Multiple Tabs (Ctrl+T), &amp; Bookmark Bar (Ctrl+Shift+O)</text>

  <!-- BROWSER MOCKUP -->
  <g transform="translate(60, 90)">
    <rect width="680" height="320" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    
    <!-- Tab Bar -->
    <rect x="10" y="10" width="660" height="35" rx="6" fill="#0F172A"/>
    <rect x="15" y="15" width="150" height="30" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="30" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Sirajul Huda Portal</text>
    <rect x="175" y="15" width="140" height="30" rx="6" fill="#334155"/>
    <text x="190" y="34" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Google Drive</text>
    <rect x="325" y="15" width="30" height="30" rx="15" fill="#334155"/>
    <text x="340" y="34" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#CBD5E1" text-anchor="middle">+</text>

    <!-- Address Bar Strip -->
    <rect x="10" y="50" width="660" height="40" fill="#1E293B"/>
    <text x="25" y="75" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">⬅  ➔  🔄</text>
    <rect x="100" y="56" width="510" height="28" rx="14" fill="#0F172A" stroke="#475569" stroke-width="1"/>
    <text x="115" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#34D399">🔒 https://sirajulhuda.org/syllabus</text>
    <text x="590" y="74" font-family="system-ui, sans-serif" font-size="12" fill="#F59E0B">⭐</text>

    <!-- Bookmarks Bar -->
    <rect x="10" y="92" width="660" height="26" fill="#0F172A"/>
    <text x="25" y="109" font-family="system-ui, sans-serif" font-size="10" fill="#60A5FA">📌 Study Bookmarks:  ⭐ Sirajul Huda  |  ⭐ W3Schools  |  ⭐ Google Drive  |  ⭐ Canva</text>

    <!-- Web Page Content Placeholder -->
    <rect x="10" y="120" width="660" height="190" fill="#0F172A"/>
    <rect x="30" y="140" width="220" height="20" rx="4" fill="#3B82F6"/>
    <rect x="30" y="170" width="400" height="10" rx="2" fill="#334155"/>
    <rect x="30" y="190" width="350" height="10" rx="2" fill="#334155"/>

    <rect x="460" y="140" width="190" height="140" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <text x="555" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle">Pro Tab Shortcuts:</text>
    <text x="475" y="190" font-family="monospace" font-size="11" fill="#CBD5E1">Ctrl + T: New Tab</text>
    <text x="475" y="215" font-family="monospace" font-size="11" fill="#CBD5E1">Ctrl + W: Close Tab</text>
    <text x="475" y="240" font-family="monospace" font-size="11" fill="#CBD5E1">Ctrl+Shift+T: Reopen</text>
    <text x="475" y="265" font-family="monospace" font-size="11" fill="#38BDF8">Ctrl + D: Bookmark</text>
  </g>
</svg>
