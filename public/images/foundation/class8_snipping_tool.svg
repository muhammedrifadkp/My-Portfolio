<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg8)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#EC4899" text-anchor="middle">SCREEN CAPTURE &amp; ANNOTATION (SNIPPING TOOL)</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 08 Capture Screenshots with Win + Shift + S &amp; Highlight Details</text>

  <!-- MOCKUP OF SCREEN CAPTURE -->
  <g transform="translate(60, 90)">
    <rect width="680" height="320" rx="12" fill="#1E293B" stroke="#EC4899" stroke-width="2"/>

    <!-- Dimmed background desktop -->
    <rect x="20" y="20" width="640" height="280" rx="8" fill="#0F172A" opacity="0.8"/>

    <!-- Snipping Tool Floating Overlay Bar at top -->
    <rect x="260" y="10" width="160" height="32" rx="16" fill="#334155" stroke="#EC4899" stroke-width="1.5"/>
    <text x="340" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F472B6" text-anchor="middle">✂ Rectangular Snip</text>

    <!-- Selection Marquee Area (Highlighted) -->
    <rect x="150" y="80" width="380" height="180" rx="4" fill="#1E293B" stroke="#F472B6" stroke-width="2" stroke-dasharray="6,4"/>
    
    <text x="340" y="120" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#F472B6" text-anchor="middle">System RAM: 16.0 GB</text>
    <rect x="230" y="105" width="220" height="22" rx="4" fill="none" stroke="#F59E0B" stroke-width="2"/> <!-- Yellow highlighter -->
    <text x="340" y="155" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1" text-anchor="middle">Selected Area Highlighted for Assignment Proof</text>

    <!-- Hotkey Pill -->
    <rect x="180" y="180" width="320" height="40" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="340" y="205" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#34D399" text-anchor="middle">⌨ Hotkey: Win + Shift + S</text>
  </g>
</svg>
