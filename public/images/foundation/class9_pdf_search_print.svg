<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bg9)"/>

  <!-- Title -->
  <text x="400" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#EF4444" text-anchor="middle">PDF MANAGEMENT, SEARCH (Ctrl+F) &amp; PRINTING</text>
  <text x="400" y="65" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">Class 09 PDF Search, Convert Documents to PDF &amp; Print Setup</text>

  <g transform="translate(60, 90)">
    <rect width="680" height="320" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="2"/>
    
    <!-- PDF Document Viewer Window -->
    <rect x="20" y="20" width="400" height="280" rx="8" fill="#0F172A"/>
    <rect x="20" y="20" width="400" height="30" rx="6" fill="#334155"/>
    <text x="35" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FCA5A5">📄 Digital_Skills_Syllabus.pdf</text>

    <!-- Search Popup Bar (Ctrl+F) -->
    <rect x="230" y="58" width="180" height="28" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="240" y="76" font-family="system-ui, sans-serif" font-size="10" fill="#F59E0B">🔍 Find: Hardware  (1/4)</text>

    <!-- Page text mock -->
    <rect x="40" y="100" width="340" height="12" fill="#334155"/>
    <rect x="40" y="120" width="120" height="12" fill="#F59E0B"/> <!-- Highlighted text -->
    <text x="45" y="130" font-family="system-ui, sans-serif" font-size="9" fill="#0F172A">Hardware Essentials</text>
    <rect x="170" y="120" width="210" height="12" fill="#334155"/>
    <rect x="40" y="140" width="300" height="12" fill="#334155"/>

    <!-- Right Side: Print & Export Box -->
    <g transform="translate(440, 20)">
      <rect width="220" height="280" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.5"/>
      <text x="110" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FCA5A5" text-anchor="middle">🖨 Print &amp; Export Setup</text>
      
      <rect x="15" y="50" width="190" height="60" rx="6" fill="#1E293B"/>
      <text x="25" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">Printer:</text>
      <text x="25" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">Microsoft Print to PDF</text>

      <rect x="15" y="125" width="190" height="60" rx="6" fill="#1E293B"/>
      <text x="25" y="145" font-family="system-ui, sans-serif" font-size="10" fill="#CBD5E1">Pages to Print:</text>
      <text x="25" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Custom (e.g. 1-3)</text>

      <rect x="15" y="205" width="190" height="50" rx="8" fill="#EF4444"/>
      <text x="110" y="235" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">Save as PDF / Print</text>
    </g>
  </g>
</svg>
